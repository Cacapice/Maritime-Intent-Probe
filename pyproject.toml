[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-intent-probe"
version = "1.3.0"
description = "Construct-validity diagnostics for mechanistic interpretability probes. Phase 1 only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Katherine J. Ombrellaro" }]
# The dependency-light high-trust runtime is bundled under evidence/runtime so
# a clean checkout remains installable without unpublished package indexes.
# The heavy experimental stack stays in requirements.txt.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
research = [
  "torch>=2.0",
  "transformer-lens>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/Cacapice/Maritime-Intent-Probe"
Platform = "https://github.com/Cacapice/high-trust-evidence"

[tool.setuptools.packages.find]
include = ["science*", "evidence_platform*", "evidence*"]

[tool.setuptools]
py-modules = ["compute_model_blind_witness"]

[tool.pytest.ini_options]
testpaths = [".", "evidence/tests"]
