name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  methodological-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m compileall -q .
      - run: python -m pytest -q test_epistemic.py test_witness_test.py test_repository_hygiene.py test_layers.py
      - run: python compute_model_blind_witness.py --n-pairs-per-class 20 --output witness_claim.json
      - name: Verify computed witness contract
        run: |
          python - <<'PY'
          import json
          data = json.load(open("witness_claim.json", encoding="utf-8"))
          assert data["multi_turn_subset"]["results"][0]["witness_auc"] == 1.0
          assert data["all_attack_families"]["results"][0]["witness_auc"] == 0.75
          assert data["per_attack_family"]["semantic"]["results"][0]["witness_auc"] == 0.5
          assert data["per_attack_family"]["encoding"]["results"][0]["witness_auc"] == 0.5
          assert set(data["redesign_priority_families"]) == {"semantic", "encoding"}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: witness-claim-${{ matrix.python-version }}
          path: witness_claim.json

  platform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q evidence/tests/test_figure_contract.py evidence/tests/test_scientific_contract.py

  research-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q test_probe.py test_encoding_transforms.py test_imports.py
